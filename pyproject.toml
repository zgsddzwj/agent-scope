[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentscope-business-lab"
version = "0.1.0"
description = "AgentScope 渐进式示例与认证多租户业务工作台"
requires-python = ">=3.12,<3.13"
dependencies = [
    "agentscope==2.0.12",
    "python-dotenv>=1.1,<2",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "aiosqlite>=0.20,<1",
    "PyJWT>=2.9,<3",
    "httpx>=0.27,<1",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
]

[tool.setuptools]
packages = ["demos"]
py-modules = ["auth", "business", "meal_orchestration", "run_demo", "web_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
